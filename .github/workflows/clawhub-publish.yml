name: clawhub-publish

# Publishes the OpenClaw package of one release tag to ClawHub and waits for ClawHub's security checks. release.yml starts
# it after each new Release; run it from the Actions tab to publish a tag again. ClawHub trusts this workflow file in the
# clawhub environment (trusted publishing): the CLI trades the job's GitHub OIDC token for a short-lived publish token, so
# the repository stores no ClawHub token.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.3.12
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the OpenClaw package to ClawHub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: clawhub
    permissions:
      contents: read
      id-token: write # the OIDC token ClawHub's trusted publishing accepts
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag must look like v1.2.3, not \"$TAG\""
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::VERSION at $TAG is $version"
            exit 1
          fi
          node scripts/pack-openclaw.mjs
      - name: Publish and wait for ClawHub's checks
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          summary="$(node scripts/release.mjs summary "$version")"
          npm exec --yes --package=clawhub@0.23.3 -- clawhub --no-input package publish dist/openclaw \
            --owner cuddler \
            --family bundle-plugin \
            --name cuddler \
            --display-name Cuddler \
            --version "$version" \
            --changelog "$summary" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-ref "$TAG" \
            --wait \
            --wait-timeout 1800
