name: clawhub-publish

# Publishes the OpenClaw package of one release tag to ClawHub and waits for ClawHub's security checks. release.yml starts
# it on the new tag after each Release; to publish a tag again, run it from the Actions tab with "Use workflow from" set to
# that tag. ClawHub trusts this workflow file in the clawhub environment (trusted publishing): the CLI trades the job's
# GitHub OIDC token for a short-lived publish token, so the repository stores no ClawHub token. ClawHub takes the owner from
# the package and checks the source against the token, so the run must be on the tag it publishes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the OpenClaw package to ClawHub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: clawhub
    permissions:
      contents: read
      id-token: write # the OIDC token ClawHub's trusted publishing accepts
    steps:
      - name: Run on a release tag
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::run this workflow on a release tag such as v1.2.3, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        # Only what went through a reviewed merge to main reaches ClawHub, whoever created the tag.
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the package
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::VERSION at $GITHUB_REF_NAME is $version"
            exit 1
          fi
          node scripts/pack-openclaw.mjs
      - name: Publish and wait for ClawHub's checks
        run: |
          version="${GITHUB_REF_NAME#v}"
          summary="$(node scripts/release.mjs summary "$version")"
          npm exec --yes --package=clawhub@0.23.3 -- clawhub --no-input package publish dist/openclaw \
            --family bundle-plugin \
            --name cuddler \
            --display-name Cuddler \
            --version "$version" \
            --changelog "$summary" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --wait \
            --wait-timeout 1800
