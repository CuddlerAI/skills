name: mcp-registry-publish

# Publishes server.json, the Cuddler MCP server's entry in the official MCP Registry (registry.modelcontextprotocol.io),
# under the name ai.cuddler/cuddler. It never runs on its own: run it from the Actions tab on main after a change to
# server.json is merged. The registry keeps every version for good and takes each version once, so a publish needs a new
# "version" in server.json, and the entry changes only when what it says about the server does (the address, the title,
# the description, the icons), not with every plugin release.
#
# The registry accepts the name because the job signs in with the Ed25519 key behind the "v=MCPv1" TXT record on
# cuddler.ai. The key is REGISTRY_PRIVATE_KEY, a secret of the mcp-registry environment, which only main can use.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz in that release (registry_1.8.1_checksums.txt)
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      REGISTRY: https://registry.modelcontextprotocol.io
    steps:
      - name: Run on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this workflow on main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate the repository
        run: node scripts/validate.mjs
      - name: Install mcp-publisher
        run: |
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      - name: The registry accepts server.json
        run: ./mcp-publisher validate server.json
      - name: This version is new
        run: |
          name="$(node -p 'encodeURIComponent(require("./server.json").name)')"
          version="$(node -p 'require("./server.json").version')"
          status="$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "${REGISTRY}/v0.1/servers/${name}/versions/${version}")"
          if [ "$status" = "200" ]; then
            echo "::error::version ${version} is already in the registry; raise \"version\" in server.json in a pull request first"
            exit 1
          elif [ "$status" != "404" ]; then
            echo "::error::the registry answered ${status} when asked for version ${version}"
            exit 1
          fi
      - name: Sign in with the cuddler.ai key
        env:
          REGISTRY_PRIVATE_KEY: ${{ secrets.REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::the mcp-registry environment has no REGISTRY_PRIVATE_KEY secret"
            exit 1
          fi
          ./mcp-publisher login dns --domain cuddler.ai --private-key "$REGISTRY_PRIVATE_KEY"
      - name: Publish
        run: ./mcp-publisher publish server.json
      - name: The registry lists this version as the latest
        run: |
          name="$(node -p 'encodeURIComponent(require("./server.json").name)')"
          version="$(node -p 'require("./server.json").version')"
          latest="$(curl -fsS --retry 3 "${REGISTRY}/v0.1/servers/${name}/versions/latest" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).server.version')"
          if [ "$latest" != "$version" ]; then
            echo "::error::the registry's latest version is ${latest}, not ${version}"
            exit 1
          fi
          echo "published ai.cuddler/cuddler ${version}: ${REGISTRY}/v0.1/servers/${name}/versions/${version}"
